[project]
name = "sonora-music-engine"
version = "0.1.0"
description = "SONORA Phase 3 Music Intelligence Engine — shared audio ingestion, validation, job orchestration, and processing interface service."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.32.0,<1.0.0",
  "pydantic>=2.9.0,<3.0.0",
  "pydantic-settings>=2.6.0,<3.0.0",
  "httpx>=0.27.0,<1.0.0",
  "PyJWT[crypto]>=2.9.0,<3.0.0",
  "python-multipart>=0.0.12,<1.0.0",
  "arq>=0.26.0,<1.0.0",
  "redis>=5.0.0,<6.0.0",
  "numpy>=1.26.4,<2.1",
  "scipy>=1.13,<2",
  "soundfile>=0.12.1",
  "librosa>=0.10.2",
  "mido>=1.3.2,<2.0.0",
  "pyloudnorm>=0.1.1,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
  "pytest-asyncio>=0.24.0,<1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
